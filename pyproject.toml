[project]
name = "recipe-pdf-parser"
version = "0.1.0"
description = "Extract recipe data from PDFs and insert into PostgreSQL"
authors = [
    {name = "Your Name",email = "your.email@example.com"}
]
readme = "README.md"
requires-python = "^3.9"
dependencies = [
    "pandas (>=2.3.3,<3.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "pdfplumber (>=0.11.8,<0.12.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "pypdf (>=6.4.0,<7.0.0)",
    "ollama (>=0.1.0,<0.5.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
